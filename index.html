<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>라마의 대모험: 이모지 에디션</title>
    <style>
        :root { --bg: #2c3e50; --wall: #34495e; --llama: #3498db; --alpaca: #e74c3c; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; }
        #header { margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
        canvas { background: #ecf0f1; border: 4px solid var(--wall); border-radius: 8px; margin-top: 5px; max-width: 98vw; }
        #ui { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 5px 0; width: 100%; }
        .stats-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .stat { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; }
        #controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 5px; margin-top: 5px; }
        .btn { width: 65px; height: 65px; background: #95a5a6; border: none; color: white; font-size: 1.2rem; border-radius: 50%; box-shadow: 0 4px #7f8c8d; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 15px; box-sizing: border-box; }
        .mode-btn { width: 300px; padding: 12px; margin: 4px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; text-align: left; position: relative; }
        .mode-btn span { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 2px; }
        .mode-emoji { font-size: 1.4rem; margin-right: 8px; vertical-align: middle; }
        .best-record { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 10px; }
        .restart { padding: 15px 40px; font-size: 1.2rem; background: #2ecc71; border: none; color: white; border-radius: 30px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="menuScreen" class="overlay">
    <h1 style="font-size: 2rem; margin-bottom: 10px;">🦙 라마의 대모험</h1>
    <div id="modeButtons"></div>
</div>

<div id="header">🦙 <span id="modeHeaderEmoji">📖</span> <span id="modeTitle">-</span></div>
<div id="ui">
    <div class="stats-row">
        <div class="stat">🔑 <span id="keys">0</span> / <span id="targetKeys">0</span></div>
        <div class="stat">❤️ <span id="lives">0</span></div>
        <div class="stat">⏱️ <span id="gameTimer">0.0</span>s</div>
        <div id="secretTimerUI" class="stat" style="display:none; background: #e74c3c;">🤫 <span id="secretTimerDisplay">60</span></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
    <div></div><button class="btn" onclick="move('up')">▲</button><div></div>
    <button class="btn" onclick="move('left')">◀</button>
    <button class="btn" onclick="move('down')">▼</button>
    <button class="btn" onclick="move('right')">▶</button>
</div>

<div id="msgScreen" class="overlay" style="display:none;">
    <h1 id="msgTitle" style="color: #2ecc71;">ROUND CLEAR!</h1>
    <div id="roundAdvice" style="margin: 15px 0; font-size: 1.1rem;"></div>
    <button class="restart" onclick="nextAction()">다음 단계로 이동</button>
</div>

<div id="finalScreen" class="overlay" style="display:none;">
    <h1 style="color: gold; font-size: 2.5rem;">HAPPY ENDING ✨</h1>
    <p>탈출 성공! 당신의 기록: <span id="finalTimeDisplay">0</span>초</p>
    <div id="newRecordMsg" style="color: #2ecc71; font-weight: bold; display: none;">뉴 레코드! 🏆</div>
    <button class="restart" onclick="location.reload()">처음으로</button>
</div>

<div id="hiddenEndingScreen" class="overlay" style="background: black; display:none;">
    <h1 style="color: red; font-size: 3rem;">💥 BOOM!!! 💥</h1>
    <p>랄파카 폭발! 진정한 챔피언!</p>
    <button class="restart" onclick="location.reload()">처음으로</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameMode = 'story', round = 1, maze = [], cols, rows, tileSize;
    let player = { x: 1, y: 1, keys: 0, lives: 3, speed: 1, invincible: false, hidden: false, targetKeys: 0 };
    let enemies = []; 
    let isRunning = false, secretTimer = 0, secretNoteSpawned = false;
    let isAlpacaRound = false, isFinalChase = false, chaseCanMove = false;
    let activeBoosters = { speed: 0, stun: 0, ghost: 0 };
    let gameInterval, startTime, totalTime = 0;

    const modes = [
        { id: 'story', name: '스토리', emoji: '📖', color: '#3498db', desc: '일반적인 모험' },
        { id: 'speed', name: '스피드', emoji: '⚡', color: '#e67e22', desc: '전체 2배속' },
        { id: 'beggar', name: '거지', emoji: '🍞', color: '#7f8c8d', desc: '부스터 없음' },
        { id: 'revenge', name: '복수', emoji: '👺', color: '#c0392b', desc: '랄파카 무리 추격' },
        { id: 'pacman', name: '팩맨', emoji: '🟡', color: '#f1c40f', desc: '모든 열쇠 수집' },
        { id: 'dark', name: '어둠', emoji: '🌑', color: '#2c3e50', desc: '제한된 시야' }
    ];

    const config = [
        { size: 13, keys: 5, advice: "🏃 1라운드: 기본 실력을 보여주세요!" }, 
        { size: 21, keys: 9, advice: "⚡ 2라운드: 부스터가 나타납니다!" }, 
        { size: 29, keys: 12, advice: "🤫 3라운드: 60초를 버티면 비밀 문이 생깁니다." },
        { size: 33, keys: 15, advice: "🌫️ 랄파카 라운드: 먼지구름 속에 숨으세요." }
    ];

    function initMenu() {
        const menu = document.getElementById('modeButtons');
        menu.innerHTML = '';
        modes.forEach(m => {
            const best = localStorage.getItem(`best_${m.id}`) || '없음';
            const btn = document.createElement('button');
            btn.className = 'mode-btn';
            btn.style.backgroundColor = m.color;
            if(m.id === 'pacman') btn.style.color = 'black';
            btn.onclick = () => setMode(m.id);
            btn.innerHTML = `<span class="mode-emoji">${m.emoji}</span>${m.name} 모드<span>${m.desc}</span><div class="best-record">⏱ ${best}${best!=='없음'?'s':''}</div>`;
            menu.appendChild(btn);
        });
    }
    initMenu();

    function setMode(modeId) {
        const m = modes.find(x => x.id === modeId);
        gameMode = modeId;
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('modeTitle').innerText = m.name.toUpperCase();
        document.getElementById('modeHeaderEmoji').innerText = m.emoji;
        
        round = (modeId === 'pacman' || modeId === 'dark') ? 3 : 1;
        player.lives = (modeId === 'pacman' || modeId === 'dark') ? 1 : 3;
        startTime = Date.now();
        initRound();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, modeId === 'speed' ? 50 : 100);
    }

    function generateMaze(size, h=null) {
        cols = size; rows = h || size;
        maze = Array.from({ length: rows }, () => Array(cols).fill(1));
        function carve(x, y) {
            maze[y][x] = 0;
            const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < cols-1 && ny > 0 && ny < rows-1 && maze[ny][nx] === 1) {
                    maze[y+dy/2][x+dx/2] = 0; carve(nx, ny);
                }
            }
        }
        carve(1, 1);
        for (let r = 1; r < rows - 1; r++) for (let c = 1; c < cols - 1; c++) if (maze[r][c] === 1 && Math.random() < 0.15) maze[r][c] = 0;
        maze[rows-2][cols-2] = 9; 
        placeItems();
    }

    function placeItems() {
        if (isFinalChase) return;
        if (gameMode === 'pacman') {
            let kCount = 0;
            for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) if(maze[r][c] === 0 && !(c===1 && r===1)) { maze[r][c] = 2; kCount++; }
            player.targetKeys = kCount;
        } else {
            let itemPool = [{id: 2, count: config[round-1].keys}];
            if (gameMode !== 'beggar' && gameMode !== 'dark') {
                if (isAlpacaRound) itemPool.push({id: 7, count: 25});
                else if (round >= 2) itemPool.push({id: 3, count: 2}, {id: 4, count: 2}, {id: 5, count: 1}, {id: 6, count: 1});
            }
            itemPool.forEach(item => {
                let p = 0; while(p < item.count) { let rx = Math.floor(Math.random()*cols), ry = Math.floor(Math.random()*rows); if(maze[ry][rx] === 0 && !(rx===1 && ry===1)) { maze[ry][rx] = item.id; p++; } }
            });
            player.targetKeys = config[round-1].keys;
        }
        document.getElementById('targetKeys').innerText = player.targetKeys;
        enemies = [];
        let eCount = (gameMode === 'revenge') ? (isAlpacaRound ? 5 : round) : 1;
        for (let i = 0; i < eCount; i++) enemies.push({ x: cols - 2, y: 1, moveTick: 0, target: null });
    }

    function gameLoop() {
        if (!isRunning) return;
        totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('gameTimer').innerText = totalTime;

        if (round === 3 && player.keys >= player.targetKeys && !secretNoteSpawned && !isAlpacaRound && gameMode !== 'pacman' && gameMode !== 'dark') {
            document.getElementById('secretTimerUI').style.display = 'block';
            secretTimer += (gameMode === 'speed' ? 2 : 1);
            let rem = 60 - Math.floor(secretTimer/10);
            document.getElementById('secretTimerDisplay').innerText = rem > 0 ? rem : 0;
            if (secretTimer >= 600) { spawnSecretNote(); secretNoteSpawned = true; document.getElementById('secretTimerUI').style.display = 'none'; }
        }
        updateBoosters();
        enemies.forEach((e, i) => {
            if (activeBoosters.stun <= 0) {
                if (isFinalChase && !chaseCanMove) return;
                e.moveTick++;
                let interval = (gameMode === 'speed') ? (isAlpacaRound ? 1.2 : 4) : (gameMode === 'revenge' ? 3 : (gameMode === 'dark' ? 5 : 4));
                if (e.moveTick >= interval) {
                    let d = Math.sqrt((e.x-player.x)**2 + (e.y-player.y)**2);
                    let isAggro = (i === 0) || (d < 7) || isFinalChase;
                    if (isAggro && !player.hidden && activeBoosters.ghost <= 0) {
                        const next = getNextStep(e.x, e.y, player.x, player.y);
                        if (next) { e.x = next.x; e.y = next.y; }
                    } else {
                        if (!e.target || (e.x === e.target.x && e.y === e.target.y)) e.target = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
                        const next = getNextStep(e.x, e.y, e.target.x, e.target.y);
                        if (next) { e.x = next.x; e.y = next.y; } else e.target = null;
                    }
                    if (Math.round(e.x) === player.x && Math.round(e.y) === player.y && activeBoosters.ghost <= 0 && !player.hidden && activeBoosters.stun <= 0) hit();
                    e.moveTick = 0;
                }
            }
        });
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let t = maze[r][c];
                ctx.fillStyle = t === 1 ? '#34495e' : '#ecf0f1';
                ctx.fillRect(c*tileSize, r*tileSize, tileSize, tileSize);
                if (t === 2) drawIcon(c, r, 'gold');
                if (t >= 3 && t <= 6) drawIcon(c, r, t===3?'#2ecc71':t===4?'#9b59b6':t===5?'#e67e22':'#1abc9c');
                if (t === 7) drawIcon(c, r, 'rgba(150,150,150,0.5)', true);
                if (t === 8) drawIcon(c, r, 'white');
                if (t === 9 || t === 99) { ctx.fillStyle = (player.keys >= player.targetKeys || isFinalChase) ? '#ff00ff' : '#95a5a6'; ctx.fillRect(c*tileSize+2, r*tileSize+2, tileSize-4, tileSize-4); }
            }
        }
        
        ctx.save();
        if(activeBoosters.ghost > 0) ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        enemies.forEach((e, i) => {
            let d = Math.sqrt((e.x-player.x)**2 + (e.y-player.y)**2);
            ctx.fillStyle = activeBoosters.stun > 0 ? '#bdc3c7' : ((i===0 || d < 7 || isFinalChase) ? '#e74c3c' : '#ff7675');
            ctx.fillRect(e.x*tileSize+2, e.y*tileSize+2, tileSize-4, tileSize-4);
        });

        if (gameMode === 'dark') {
            ctx.save(); ctx.globalCompositeOperation = 'destination-in';
            let grad = ctx.createRadialGradient(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, 0, player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, tileSize*6);
            grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width, canvas.height); ctx.restore();
        }
    }

    function drawIcon(c, r, color, isCloud = false) {
        ctx.fillStyle = color; ctx.beginPath();
        ctx.arc(c*tileSize+tileSize/2, r*tileSize+tileSize/2, isCloud ? tileSize/2.5 : tileSize/4, 0, Math.PI*2); ctx.fill();
    }

    function move(dir) {
        if (!isRunning) return;
        let nx = player.x, ny = player.y;
        if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;
        if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx] !== 1) { player.x = nx; player.y = ny; checkTile(); }
        draw();
    }

    function checkTile() {
        let t = maze[player.y][player.x];
        player.hidden = (t === 7);
        if (t === 2) { player.keys++; maze[player.y][player.x] = 0; document.getElementById('keys').innerText = player.keys; }
        if (t >= 3 && t <= 6) {
            let dur = gameMode === 'speed' ? 40 : 80;
            if(t===3) activeBoosters.speed = dur; if(t===4) activeBoosters.stun = dur; if(t===6) activeBoosters.ghost = dur;
            maze[player.y][player.x] = 0;
        }
        if (t === 8) { maze[player.y][player.x] = 0; isAlpacaRound = true; initRound(); }
        if (t === 9 && player.keys >= player.targetKeys) winRound();
        if (t === 99) { isRunning = false; document.getElementById('hiddenEndingScreen').style.display = 'flex'; }
    }

    function updateBoosters() {
        if(activeBoosters.speed > 0) activeBoosters.speed--;
        if(activeBoosters.stun > 0) activeBoosters.stun--;
        if(activeBoosters.ghost > 0) activeBoosters.ghost--;
    }

    function hit() {
        if (isFinalChase) { isRunning = false; alert("잡혔습니다!"); startFinalChase(); return; }
        player.lives--; document.getElementById('lives').innerText = player.lives;
        if (player.lives <= 0) { alert("Game Over!"); location.reload(); }
        else { player.x = 1; player.y = 1; enemies.forEach(e => {e.x = cols-2; e.y = 1;}); }
    }

    function winRound() {
        isRunning = false;
        if (isAlpacaRound) { startFinalChase(); }
        else if (round >= 3 || gameMode === 'pacman' || gameMode === 'dark') { 
            showFinalEnd();
        } else { 
            document.getElementById('msgScreen').style.display = 'flex';
            document.getElementById('roundAdvice').innerText = config[round-1].advice;
        }
    }

    function showFinalEnd() {
        const endTime = totalTime;
        document.getElementById('finalTimeDisplay').innerText = endTime;
        const bestKey = `best_${gameMode}`;
        const prevBest = localStorage.getItem(bestKey);
        if (!prevBest || parseFloat(endTime) < parseFloat(prevBest)) {
            localStorage.setItem(bestKey, endTime);
            document.getElementById('newRecordMsg').style.display = 'block';
        }
        document.getElementById('finalScreen').style.display = 'flex';
    }

    function nextAction() { document.getElementById('msgScreen').style.display = 'none'; round++; initRound(); }

    function initRound() {
        const cfg = config[round-1] || config[0];
        player.x = 1; player.y = 1; player.keys = 0; secretTimer = 0; secretNoteSpawned = false;
        document.getElementById('lives').innerText = player.lives;
        document.getElementById('keys').innerText = 0;
        generateMaze(cfg.size);
        tileSize = Math.floor(window.innerHeight * 0.42 / cfg.size);
        canvas.width = tileSize * cfg.size; canvas.height = tileSize * cfg.size;
        isRunning = true;
    }

    function startFinalChase() {
        isAlpacaRound = false; isFinalChase = true; chaseCanMove = false;
        generateMaze(32, 5); 
        maze[2][0] = 0; maze[2][31] = 99;
        tileSize = Math.floor((window.innerWidth * 0.95) / 32);
        canvas.width = tileSize * 32; canvas.height = tileSize * 5;
        player.x = 0; player.y = 2;
        enemies = [{ x: 0, y: 2, moveTick: 0 }];
        setTimeout(() => { chaseCanMove = true; }, 3000);
        isRunning = true;
    }

    function getNextStep(startX, startY, targetX, targetY) {
        const queue = [[startX, startY, []]]; const visited = new Set([`${startX},${startY}`]);
        while(queue.length > 0) {
            const [x, y, path] = queue.shift(); if(x === targetX && y === targetY) return path[0];
            for(const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                const nx = x+dx, ny = y+dy;
                if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx]!==1 && !visited.has(`${nx},${ny}`)) {
                    visited.add(`${nx},${ny}`); queue.push([nx, ny, [...path, {x:nx, y:ny}]]);
                }
            }
        }
        return null;
    }

    function spawnSecretNote() { maze[rows-3][cols-3] = 8; }
    window.addEventListener('keydown', e => { if(isRunning && e.key.includes('Arrow')) move(e.key.replace('Arrow','').toLowerCase()); });
</script>
</body>
</html>
