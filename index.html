<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>라마의 대모험: 최종 결전</title>
    <style>
        :root { --bg: #2c3e50; --wall: #34495e; --llama: #3498db; --alpaca: #e74c3c; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; }
        #header { margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
        canvas { background: #ecf0f1; border: 4px solid var(--wall); border-radius: 8px; margin-top: 5px; max-width: 98vw; }
        #ui { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 5px 0; width: 100%; }
        .stats-row { display: flex; gap: 10px; justify-content: center; }
        .stat { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; }
        #activeEffects { display: flex; gap: 5px; min-height: 25px; flex-wrap: wrap; justify-content: center; }
        .effect-tag { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
        #controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; margin-top: 5px; }
        .btn { width: 60px; height: 60px; background: #95a5a6; border: none; color: white; font-size: 1.2rem; border-radius: 50%; box-shadow: 0 4px #7f8c8d; }
        .btn:active { transform: translateY(2px); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 20px; box-sizing: border-box; }
        .restart { padding: 15px 40px; font-size: 1.2rem; background: #2ecc71; border: none; color: white; border-radius: 30px; margin-top: 20px; cursor: pointer; box-shadow: 0 5px #27ae60; font-weight: bold; }
        .hidden-mode { --wall: #800000; --bg: #300000; }
    </style>
</head>
<body id="gameBody">

<div id="startScreen" class="overlay">
    <h1 style="font-size: 3rem; margin-bottom: 10px;">🦙<br>라마의 대모험</h1>
    <p style="color: #bdc3c7;">랄파카도 이제 벽을 뚫지 못합니다!</p>
    <button class="restart" onclick="startGame()">도전 시작</button>
</div>

<div id="header">🦙 라운드 <span id="roundNum">1</span></div>
<div id="ui">
    <div class="stats-row">
        <div class="stat">🔑 <span id="keys">0</span> / <span id="targetKeys">5</span></div>
        <div class="stat">❤️ <span id="lives">3</span></div>
        <div id="secretTimerUI" class="stat" style="display:none;">⏱️ <span id="secretTimerDisplay">60</span></div>
        <div id="chaseWarning" class="stat" style="display:none; color: #ff4d4d;">⚠️ 경고!</div>
    </div>
    <div id="activeEffects"></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
    <div></div><button class="btn" onclick="move('up')">▲</button><div></div>
    <button class="btn" onclick="move('left')">◀</button>
    <button class="btn" onclick="move('down')">▼</button>
    <button class="btn" onclick="move('right')">▶</button>
</div>

<div id="msgScreen" class="overlay" style="display:none;">
    <h1 id="msgTitle" style="color: #2ecc71;">ROUND CLEAR!</h1>
    <div id="roundAdvice" style="margin: 15px 0;"></div>
    <button class="restart" onclick="nextAction()">다음 단계로 이동</button>
</div>

<div id="gameOverScreen" class="overlay" style="display:none;">
    <h1 style="color: #ff4d4d; font-size: 3rem;">GAME OVER</h1>
    <button class="restart" style="background: #e74c3c;" onclick="location.reload()">처음부터 다시</button>
</div>

<div id="finalScreen" class="overlay" style="display:none;">
    <h1 style="color: gold;">HAPPY ENDING ✨</h1>
    <p>축하합니다! 모든 시련을 이겨냈습니다.</p>
    <button class="restart" onclick="location.reload()">다시 하기</button>
</div>

<div id="hiddenEndingScreen" class="overlay" style="background: black; display:none;">
    <h1 style="color: red;">💥 BOOM!!! 💥</h1>
    <p>랄파카가 폭발했습니다! 당신은 전설의 라마입니다.</p>
    <button class="restart" onclick="location.reload()">처음으로</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let round = 1, maze = [], cols, rows, tileSize;
    let player = { x: 1, y: 1, keys: 0, lives: 3, speed: 1, invincible: false, hidden: false };
    let enemy = { x: 0, y: 0, moveTick: 0, patrolTarget: null };
    let isRunning = false, secretTimer = 0, secretNoteSpawned = false;
    let isAlpacaRound = false, isFinalChase = false, chaseCanMove = false;
    let activeBoosters = { speed: 0, stun: 0, ghost: 0 };

    const config = [
        { size: 13, keys: 5, advice: "🏃 1라운드: 기본 실력을 보여주세요!" }, 
        { size: 21, keys: 9, advice: "⚡ 2라운드: 부스터가 나타납니다!" }, 
        { size: 29, keys: 12, advice: "🤫 3라운드: 60초를 버티면 문이 생깁니다." },
        { size: 33, keys: 15, advice: "🌫️ 랄파카 라운드: 은신만이 살 길입니다." }
    ];

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        initRound();
    }

    function generateMaze(size) {
        cols = size; rows = size;
        maze = Array.from({ length: rows }, () => Array(cols).fill(1));
        function carve(x, y) {
            maze[y][x] = 0;
            const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < cols-1 && ny > 0 && ny < rows-1 && maze[ny][nx] === 1) {
                    maze[y + dy/2][x + dx/2] = 0; carve(nx, ny);
                }
            }
        }
        carve(1, 1);
        for (let r = 1; r < rows - 1; r++) {
            for (let c = 1; c < cols - 1; c++) {
                if (maze[r][c] === 1 && Math.random() < 0.2) maze[r][c] = 0;
            }
        }
        maze[rows-2][cols-2] = 9; 
        placeItems();
    }

    function placeItems() {
        const currentCfg = config[round-1] || config[0];
        let itemPool = [{id: 2, count: currentCfg.keys}]; 
        if (isAlpacaRound) itemPool.push({id: 7, count: 25});
        else if (round === 2 || round === 3) itemPool.push({id: 3, count: 2}, {id: 4, count: 2}, {id: 5, count: 2}, {id: 6, count: 2});

        itemPool.forEach(item => {
            let placed = 0;
            while (placed < item.count) {
                let rx = Math.floor(Math.random()*cols), ry = Math.floor(Math.random()*rows);
                if (maze[ry][rx] === 0 && !(rx===1 && ry===1)) { maze[ry][rx] = item.id; placed++; }
            }
        });
        enemy.x = cols-2; enemy.y = 1;
    }

    function startFinalChase() {
        isAlpacaRound = false; isFinalChase = true; chaseCanMove = false;
        cols = 32; rows = 5;
        maze = Array.from({ length: rows }, () => Array(cols).fill(1));
        function carveChase(x, y) {
            maze[y][x] = 0;
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx*2, ny = y + dy*2;
                if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && maze[ny][nx] === 1) {
                    maze[y + dy][x + dx] = 0; carveChase(nx, ny);
                }
            }
        }
        carveChase(0, 2);
        maze[2][0] = 0; maze[2][cols-1] = 99;
        tileSize = Math.floor((window.innerWidth * 0.95) / cols);
        canvas.width = tileSize * cols; canvas.height = tileSize * rows;
        player.x = 0; player.y = 2; enemy.x = 0; enemy.y = 2; // 시작 위치 동일, 딜레이로 조절
        document.getElementById('chaseWarning').style.display = 'block';
        document.getElementById('chaseWarning').innerText = "⚠️ 4초 뒤 추격 시작!";
        setTimeout(() => {
            chaseCanMove = true;
            document.getElementById('chaseWarning').innerText = "🔥 달려어어!!";
            setTimeout(() => document.getElementById('chaseWarning').style.display = 'none', 2000);
        }, 4000);
        isRunning = true;
    }

    setInterval(() => {
        if (!isRunning) return;
        if (round === 3 && player.keys >= config[2].keys && !secretNoteSpawned && !isAlpacaRound) {
            document.getElementById('secretTimerUI').style.display = 'block';
            secretTimer++;
            let rem = 60 - Math.floor(secretTimer/10);
            document.getElementById('secretTimerDisplay').innerText = rem > 0 ? rem : 0;
            if (secretTimer >= 600) { spawnSecretNote(); secretNoteSpawned = true; document.getElementById('secretTimerUI').style.display = 'none'; }
        }
        updateBoosterUI();
        if (activeBoosters.stun <= 0) {
            enemy.moveTick++;
            // 최후의 추격전일 때는 랄파카가 조금 더 빨리 반응하게 설정 (2.0)
            let interval = isFinalChase ? 2.0 : (isAlpacaRound ? 2 : Math.max(2.5, 6 - (player.keys * 0.4)));
            if (enemy.moveTick >= interval) {
                if (isFinalChase && !chaseCanMove) { /* 대기 */ }
                else {
                    if (player.hidden || activeBoosters.ghost > 0) {
                        if (!enemy.patrolTarget || (enemy.x === enemy.patrolTarget.x && enemy.y === enemy.patrolTarget.y)) {
                            enemy.patrolTarget = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
                        }
                        const next = getNextStep(enemy.x, enemy.y, enemy.patrolTarget.x, enemy.patrolTarget.y);
                        if (next) { enemy.x = next.x; enemy.y = next.y; } else enemy.patrolTarget = null;
                    } else {
                        const next = getNextStep(enemy.x, enemy.y, player.x, player.y);
                        if (next) { enemy.x = next.x; enemy.y = next.y; }
                    }
                    if (enemy.x === player.x && enemy.y === player.y && activeBoosters.ghost <= 0 && !player.invincible && !player.hidden && activeBoosters.stun <= 0) hit();
                }
                enemy.moveTick = 0;
            }
        }
        draw();
    }, 100);

    function checkTile() {
        let t = maze[player.y][player.x];
        player.hidden = (t === 7);
        if (t === 2) { player.keys++; maze[player.y][player.x] = 0; document.getElementById('keys').innerText = player.keys; return false; }
        if (t >= 3 && t <= 6) {
            if(t===3) activeBoosters.speed = 60;
            if(t===4) activeBoosters.stun = 50;
            if(t===5) { maze[player.y][player.x] = 0; while(true) { let rx = Math.floor(Math.random()*cols), ry = Math.floor(Math.random()*rows); if(maze[ry][rx] === 0) { player.x = rx; player.y = ry; break; } } return true; }
            if(t===6) activeBoosters.ghost = 70;
            maze[player.y][player.x] = 0; return true;
        }
        if (t === 8) { maze[player.y][player.x] = 0; startHiddenRound(); return true; }
        if (t === 9 || t === 99) {
            if (isFinalChase && t === 99) { isRunning = false; document.getElementById('hiddenEndingScreen').style.display = 'flex'; return true; }
            if (player.keys >= config[round-1].keys) {
                isRunning = false;
                if (isAlpacaRound) startFinalChase();
                else if (round >= 3) document.getElementById('finalScreen').style.display = 'flex';
                else winRound();
                return true;
            }
        }
        return false;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let t = maze[r][c];
                ctx.fillStyle = t === 1 ? (isAlpacaRound || isFinalChase ? '#4d0000' : '#34495e') : (isAlpacaRound || isFinalChase ? '#200000' : '#ecf0f1');
                ctx.fillRect(c*tileSize, r*tileSize, tileSize, tileSize);
                if (t === 2) drawIcon(c, r, 'gold');
                if (t >= 3 && t <= 6) drawIcon(c, r, t === 3 ? '#2ecc71' : t === 4 ? '#9b59b6' : t === 5 ? '#e67e22' : '#1abc9c');
                if (t === 7) { ctx.fillStyle = 'rgba(120, 120, 120, 0.7)'; ctx.beginPath(); ctx.arc(c*tileSize+tileSize/2, r*tileSize+tileSize/2, tileSize/2.5, 0, Math.PI*2); ctx.fill(); }
                if (t === 8) drawIcon(c, r, 'white');
                if (t === 9 || t === 99) { ctx.fillStyle = (isFinalChase || player.keys >= config[round-1].keys) ? '#ff00ff' : '#95a5a6'; ctx.fillRect(c*tileSize+2, r*tileSize+2, tileSize-4, tileSize-4); }
            }
        }
        ctx.globalAlpha = (player.hidden || activeBoosters.ghost > 0) ? 0.3 : (player.invincible ? 0.6 : 1);
        ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = activeBoosters.stun > 0 ? '#bdc3c7' : '#e74c3c';
        ctx.fillRect(enemy.x*tileSize+2, enemy.y*tileSize+2, tileSize-4, tileSize-4);
    }

    function drawIcon(c, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(c*tileSize+tileSize/2, r*tileSize+tileSize/2, tileSize/4, 0, Math.PI*2); ctx.fill(); }

    function move(dir) {
        if (!isRunning) return;
        for(let s=0; s<player.speed; s++) {
            let nx = player.x, ny = player.y;
            if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;
            if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx] !== 1) { player.x = nx; player.y = ny; if(checkTile()) break; } else break;
        }
        draw();
    }

    function updateBoosterUI() {
        let html = '';
        if (activeBoosters.speed > 0) { activeBoosters.speed--; player.speed = 2; html += `<span class="effect-tag" style="background:#2ecc71">⚡ ${(activeBoosters.speed/10).toFixed(1)}s</span>`; } else player.speed = 1;
        if (activeBoosters.stun > 0) { activeBoosters.stun--; html += `<span class="effect-tag" style="background:#9b59b6">❄️ ${(activeBoosters.stun/10).toFixed(1)}s</span>`; }
        if (activeBoosters.ghost > 0) { activeBoosters.ghost--; html += `<span class="effect-tag" style="background:#1abc9c">👻 ${(activeBoosters.ghost/10).toFixed(1)}s</span>`; }
        document.getElementById('activeEffects').innerHTML = html;
    }

    function spawnSecretNote() { let placed = false; while(!placed) { let rx = Math.floor(Math.random()*cols), ry = Math.floor(Math.random()*rows); if(maze[ry][rx] === 0) { maze[ry][rx] = 8; placed = true; } } }

    function getNextStep(startX, startY, targetX, targetY) {
        // 정수 좌표 보정
        let sx = Math.round(startX), sy = Math.round(startY);
        const queue = [[sx, sy, []]]; const visited = new Set([`${sx},${sy}`]);
        while(queue.length > 0) {
            const [x, y, path] = queue.shift(); if(x === targetX && y === targetY) return path[0];
            for(const [dx, dy] of [[0,1], [0,-1], [1,0], [-1,0]]) {
                const nx = x+dx, ny = y+dy;
                if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx]!==1 && !visited.has(`${nx},${ny}`)) { visited.add(`${nx},${ny}`); queue.push([nx, ny, [...path, {x:nx, y:ny}]]); }
            }
        }
        return null;
    }

    function startHiddenRound() { round = 4; isAlpacaRound = true; document.getElementById('gameBody').classList.add('hidden-mode'); initRound(); }

    function hit() {
        if (isAlpacaRound || isFinalChase) { isRunning = false; alert("잡혔습니다!"); if(isFinalChase) startFinalChase(); else initRound(); }
        else { player.lives--; document.getElementById('lives').innerText = player.lives; if (player.lives <= 0) { isRunning = false; document.getElementById('gameOverScreen').style.display = 'flex'; } else { player.x = 1; player.y = 1; resetItemsOnly(); player.invincible = true; setTimeout(() => player.invincible = false, 5000); } }
    }

    function resetItemsOnly() {
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (maze[r][c] >= 2 && maze[r][c] <= 8) maze[r][c] = 0;
        player.keys = 0; document.getElementById('keys').innerText = 0; placeItems();
    }

    function initRound() {
        const cfg = config[round-1]; player.keys = 0; player.lives = isAlpacaRound ? 1 : 3; player.x = 1; player.y = 1; secretTimer = 0; secretNoteSpawned = false;
        document.getElementById('roundNum').innerText = isAlpacaRound ? "HIDDEN" : round;
        document.getElementById('targetKeys').innerText = cfg.keys; document.getElementById('lives').innerText = player.lives;
        document.getElementById('keys').innerText = 0; document.getElementById('secretTimerUI').style.display = 'none';
        generateMaze(cfg.size); tileSize = Math.floor(window.innerHeight * 0.5 / cfg.size); canvas.width = tileSize * cfg.size; canvas.height = tileSize * cfg.size; isRunning = true;
    }

    function winRound() { isRunning = false; document.getElementById('msgScreen').style.display = 'flex'; document.getElementById('roundAdvice').innerText = config[round-1].advice; nextAction = () => { document.getElementById('msgScreen').style.display = 'none'; round++; initRound(); }; }
    let nextAction = () => {};
    window.addEventListener('keydown', e => { if(isRunning && e.key.includes('Arrow')) move(e.key.replace('Arrow','').toLowerCase()); });
</script>
</body>
</html>
