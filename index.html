<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>라마의 대모험: 라스트 체이스</title>
    <style>
        :root { --bg: #2c3e50; --wall: #34495e; --red-wall: #c0392b; --crimson: #800000; --llama: #3498db; --alpaca: #e74c3c; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; transition: background 0.5s; }
        #header { margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
        canvas { background: #ecf0f1; border: 4px solid var(--wall); border-radius: 8px; margin-top: 5px; max-width: 98vw; }
        #ui { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 5px 0; width: 100%; }
        .stats-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .stat { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; }
        #activeEffects { display: flex; gap: 5px; min-height: 30px; margin-top: 5px; }
        .effect-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        #controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 5px; margin-top: 5px; }
        .btn { width: 65px; height: 65px; background: #95a5a6; border: none; color: white; font-size: 1.2rem; border-radius: 50%; box-shadow: 0 4px #7f8c8d; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 15px; box-sizing: border-box; }
        .mode-btn { width: 300px; padding: 12px; margin: 4px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; text-align: left; position: relative; }
        .mode-btn span { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 2px; }
        .restart { padding: 15px 40px; font-size: 1.2rem; background: #2ecc71; border: none; color: white; border-radius: 30px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="menuScreen" class="overlay">
    <h1 style="font-size: 2rem; margin-bottom: 10px;">🦙 라마의 대모험</h1>
    <div id="modeButtons"></div>
</div>

<div id="header">🦙 <span id="modeHeaderEmoji">📖</span> <span id="modeTitle">-</span> | 🚩 RD <span id="roundNum">1</span></div>
<div id="ui">
    <div class="stats-row">
        <div class="stat">🔑 <span id="keys">0</span> / <span id="targetKeys">0</span></div>
        <div class="stat">❤️ <span id="lives">0</span></div>
        <div class="stat">⏱️ <span id="gameTimer">0.0</span>s</div>
        <div id="secretTimerUI" class="stat" style="display:none; background: #e74c3c;">🤫 <span id="secretTimerDisplay">60</span></div>
    </div>
    <div id="activeEffects"></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
    <div></div><button class="btn" onclick="move('up')">▲</button><div></div>
    <button class="btn" onclick="move('left')">◀</button>
    <button class="btn" onclick="move('down')">▼</button>
    <button class="btn" onclick="move('right')">▶</button>
</div>

<div id="msgScreen" class="overlay" style="display:none;">
    <h1 id="msgTitle" style="color: #2ecc71;">ROUND CLEAR!</h1>
    <div id="roundAdvice" style="margin: 15px 0; font-size: 1.1rem;"></div>
    <button class="restart" onclick="nextAction()">다음 단계로 이동</button>
</div>

<div id="finalScreen" class="overlay" style="display:none;">
    <h1 id="finalStatus" style="color: gold; font-size: 2.5rem;">HAPPY ENDING ✨</h1>
    <p id="finalMsg">탈출 성공! 기록: <span id="finalTimeDisplay">0</span>초</p>
    <button class="restart" onclick="location.reload()">처음으로</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameMode = 'story', round = 1, maze = [], cols, rows, tileSize;
    let player = { x: 1, y: 1, keys: 0, lives: 3, speed: 1, hidden: false, targetKeys: 0 };
    let enemies = []; 
    let isRunning = false, secretTimer = 0, secretNoteSpawned = false;
    let isAlpacaRound = false, isFinalChase = false;
    let activeBoosters = { speed: 0, stun: 0, ghost: 0 };
    let gameInterval, startTime, totalTime = 0;
    let particles = [];

    const modes = [
        { id: 'story', name: '스토리', emoji: '📖', color: '#3498db', desc: '일반적인 모험' },
        { id: 'speed', name: '스피드', emoji: '⚡', color: '#e67e22', desc: '2배 빠른 전개' },
        { id: 'beggar', name: '거지', emoji: '🍞', color: '#7f8c8d', desc: '부스터 없음' },
        { id: 'revenge', name: '복수', emoji: '👺', color: '#c0392b', desc: '더 많은 추격자' },
        { id: 'pacman', name: '팩맨', emoji: '🟡', color: '#f1c40f', desc: '모든 열쇠 수집' },
        { id: 'dark', name: '어둠', emoji: '🌑', color: '#2c3e50', desc: '시야 제한' }
    ];

    const config = [
        { size: 13, keys: 5, advice: "🏃 1라운드: 기본 실력을 보여주세요!" }, 
        { size: 21, keys: 9, advice: "⚡ 2라운드: 부스터가 나타납니다!" }, 
        { size: 29, keys: 12, advice: "🤫 3라운드: 60초를 버티면 비밀 문이 생깁니다." },
        { size: 33, keys: 15, advice: "🌫️ 랄파카 라운드: 먼지구름 속에 숨으세요." }
    ];

    function initMenu() {
        const menu = document.getElementById('modeButtons');
        menu.innerHTML = '';
        modes.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'mode-btn';
            btn.style.backgroundColor = m.color;
            btn.onclick = () => setMode(m.id);
            btn.innerHTML = `<span style="font-size:1.4rem; margin-right:8px;">${m.emoji}</span>${m.name} 모드<span>${m.desc}</span>`;
            menu.appendChild(btn);
        });
    }
    initMenu();

    function setMode(modeId) {
        gameMode = modeId;
        document.getElementById('menuScreen').style.display = 'none';
        const m = modes.find(x => x.id === modeId);
        document.getElementById('modeTitle').innerText = m.name.toUpperCase();
        document.getElementById('modeHeaderEmoji').innerText = m.emoji;
        round = (modeId === 'pacman' || modeId === 'dark') ? 3 : 1;
        player.lives = (modeId === 'pacman' || modeId === 'dark') ? 1 : 3;
        startTime = Date.now();
        initRound();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, modeId === 'speed' ? 50 : 100);
    }

    function generateMaze(size, h=null) {
        cols = size; rows = h || size;
        maze = Array.from({ length: rows }, () => Array(cols).fill(1));
        function carve(x, y) {
            maze[y][x] = 0;
            const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < cols-1 && ny > 0 && ny < rows-1 && maze[ny][nx] === 1) {
                    maze[y+dy/2][x+dx/2] = 0; carve(nx, ny);
                }
            }
        }
        carve(1, 1);
        for (let r = 1; r < rows - 1; r++) for (let c = 1; c < cols - 1; c++) if (maze[r][c] === 1 && Math.random() < 0.2) maze[r][c] = 0;
        if (!isFinalChase) maze[rows-2][cols-2] = 9; 
        placeItems();
    }

    function placeItems() {
        if (isFinalChase) return;
        for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) if(maze[r][c] !== 1 && maze[r][c] !== 9) maze[r][c] = 0;
        
        if (gameMode === 'pacman') {
            let kCount = 0;
            for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) if(maze[r][c] === 0 && !(c===1 && r===1)) { maze[r][c] = 2; kCount++; }
            player.targetKeys = kCount;
        } else if (isAlpacaRound) {
            player.targetKeys = 15;
            spawnItem(2, 15);
            if (gameMode !== 'beggar') spawnItem(7, 25);
        } else {
            player.targetKeys = config[round-1].keys;
            spawnItem(2, player.targetKeys);
            if (round > 1 && gameMode !== 'beggar' && gameMode !== 'dark') {
                spawnItem(3, 2); spawnItem(4, 2); spawnItem(5, 1); spawnItem(6, 1);
            }
        }
        document.getElementById('targetKeys').innerText = player.targetKeys;
        
        enemies = [];
        let eCount = (gameMode === 'revenge' || isAlpacaRound) ? (isAlpacaRound ? 5 : round) : 1;
        if (gameMode === 'story' || gameMode === 'speed' || gameMode === 'beggar') eCount = round;

        for (let i = 0; i < eCount; i++) {
            enemies.push({ 
                x: cols - 2, y: 1, 
                moveTick: 0, 
                target: {x: 1, y: 1}, 
                isWanderer: i > 0,
                wanderState: false 
            });
        }
    }

    function spawnItem(id, count) {
        let p = 0; while(p < count) { 
            let rx = Math.floor(Math.random()*cols), ry = Math.floor(Math.random()*rows); 
            if(maze[ry][rx] === 0 && !(rx===1 && ry===1)) { maze[ry][rx] = id; p++; } 
        }
    }

    function gameLoop() {
        if (!isRunning) return;
        totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('gameTimer').innerText = totalTime;

        if (round === 3 && player.keys >= player.targetKeys && !secretNoteSpawned && !isAlpacaRound && gameMode !== 'pacman' && gameMode !== 'dark') {
            document.getElementById('secretTimerUI').style.display = 'block';
            secretTimer += (gameMode === 'speed' ? 2 : 1);
            let rem = 60 - Math.floor(secretTimer/10);
            document.getElementById('secretTimerDisplay').innerText = rem > 0 ? rem : 0;
            if (secretTimer >= 600) { spawnSecretNote(); secretNoteSpawned = true; document.getElementById('secretTimerUI').style.display = 'none'; }
        }
        updateBoosters();
        updateUI();
        updateParticles();

        enemies.forEach((e) => {
            if (activeBoosters.stun <= 0) {
                e.moveTick++;
                let interval = (isAlpacaRound || isFinalChase) ? (gameMode === 'speed' ? 0.6 : 2) : Math.max(2, 5 - (player.keys * 0.3));
                if (e.moveTick >= interval) {
                    let tx, ty;
                    
                    // 핵심 AI 로직: 플레이어가 은신/유령일 때는 모든 랄파카가 방황
                    if (player.hidden || activeBoosters.ghost > 0) {
                        // 방황 목표가 없거나 도달했으면 새로운 랜덤 목표 설정
                        if (!e.wanderState || (Math.abs(e.x - e.target.x) < 1 && Math.abs(e.y - e.target.y) < 1)) {
                            e.target = getRandomWalkableTile();
                            e.wanderState = true;
                        }
                        tx = e.target.x; ty = e.target.y;
                    } else {
                        e.wanderState = false; // 은신 풀리면 방황 상태 해제
                        if (e.isWanderer) {
                            // 방황자 AI: 평상시엔 7칸 밖이면 방황, 안쪽이면 추격
                            let dist = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
                            if (dist > 7) {
                                if (Math.abs(e.x - e.target.x) < 1 && Math.abs(e.y - e.target.y) < 1) {
                                    e.target = getRandomWalkableTile();
                                }
                                tx = e.target.x; ty = e.target.y;
                            } else { tx = player.x; ty = player.y; }
                        } else {
                            // 추격자 AI: 집요하게 추격
                            tx = player.x; ty = player.y;
                        }
                    }

                    const next = getNextStep(e.x, e.y, tx, ty);
                    if (next) { e.x = next.x; e.y = next.y; }
                    
                    if (Math.round(e.x) === player.x && Math.round(e.y) === player.y && activeBoosters.ghost <= 0 && !player.hidden) hit();
                    e.moveTick = 0;
                }
            }
        });
        draw();
    }

    function getRandomWalkableTile() {
        let rx, ry;
        do { rx = Math.floor(Math.random()*cols); ry = Math.floor(Math.random()*rows); } 
        while(maze[ry][rx] === 1);
        return {x: rx, y: ry};
    }

    function updateUI() {
        const effectBox = document.getElementById('activeEffects');
        effectBox.innerHTML = '';
        if(activeBoosters.speed > 0) effectBox.innerHTML += `<span class="effect-badge" style="background:#2ecc71">👞 ${Math.ceil(activeBoosters.speed/10)}s</span>`;
        if(activeBoosters.stun > 0) effectBox.innerHTML += `<span class="effect-badge" style="background:#9b59b6">🌀 ${Math.ceil(activeBoosters.stun/10)}s</span>`;
        if(activeBoosters.ghost > 0) effectBox.innerHTML += `<span class="effect-badge" style="background:#1abc9c">👻 ${Math.ceil(activeBoosters.ghost/10)}s</span>`;
        document.getElementById('roundNum').innerText = isAlpacaRound ? "SECRET" : (isFinalChase ? "FINAL" : round);
        document.getElementById('lives').innerText = player.lives;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const wallColor = isAlpacaRound ? '#800000' : (isFinalChase ? '#c0392b' : '#34495e');
        canvas.style.borderColor = wallColor;
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let t = maze[r][c];
                ctx.fillStyle = t === 1 ? wallColor : '#ecf0f1';
                ctx.fillRect(c*tileSize, r*tileSize, tileSize, tileSize);
                if (t === 2) drawIcon(c, r, 'gold');
                if (t >= 3 && t <= 6) drawIcon(c, r, t === 3 ? '#2ecc71' : t === 4 ? '#9b59b6' : t === 5 ? '#e67e22' : '#1abc9c');
                if (t === 7) drawIcon(c, r, 'rgba(150,150,150,0.5)', true);
                if (t === 8) drawIcon(c, r, 'white');
                if (t === 9 || t === 99) { ctx.fillStyle = (player.keys >= player.targetKeys || t === 99) ? '#ff00ff' : '#95a5a6'; ctx.fillRect(c*tileSize+2, r*tileSize+2, tileSize-4, tileSize-4); }
            }
        }
        ctx.save();
        if(activeBoosters.ghost > 0) ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        enemies.forEach(e => {
            ctx.fillStyle = activeBoosters.stun > 0 ? '#bdc3c7' : '#e74c3c';
            ctx.fillRect(e.x*tileSize+2, e.y*tileSize+2, tileSize-4, tileSize-4);
        });
        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1.0;
        if (gameMode === 'dark' && !isAlpacaRound && !isFinalChase) {
            ctx.save(); ctx.globalCompositeOperation = 'destination-in';
            let grad = ctx.createRadialGradient(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, 0, player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, tileSize*6);
            grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width, canvas.height); ctx.restore();
        }
    }

    function drawIcon(c, r, color, isCloud = false) {
        ctx.fillStyle = color; ctx.beginPath();
        ctx.arc(c*tileSize+tileSize/2, r*tileSize+tileSize/2, isCloud ? tileSize/2.5 : tileSize/4, 0, Math.PI*2); ctx.fill();
    }

    function move(dir) {
        if (!isRunning) return;
        let moves = activeBoosters.speed > 0 ? 2 : 1;
        for(let i=0; i<moves; i++) {
            let nx = player.x, ny = player.y;
            if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;
            if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx] !== 1) { player.x = nx; player.y = ny; if(checkTile()) break; }
        }
        draw();
    }

    function checkTile() {
        let t = maze[player.y][player.x];
        player.hidden = (t === 7);
        if (t === 2) { player.keys++; maze[player.y][player.x] = 0; document.getElementById('keys').innerText = player.keys; return true; }
        if (t >= 3 && t <= 6) {
            let dur = gameMode === 'speed' ? 40 : 80;
            if(t===3) activeBoosters.speed = dur;
            if(t===4) activeBoosters.stun = dur;
            if(t===5) { maze[player.y][player.x] = 0; teleportPlayer(); return true; }
            if(t===6) activeBoosters.ghost = dur;
            maze[player.y][player.x] = 0; return true;
        }
        if (t === 8) { maze[player.y][player.x] = 0; isAlpacaRound = true; initRound(); return true; }
        if (t === 9 && player.keys >= player.targetKeys) winRound();
        if (t === 99) { triggerHiddenEnding(); }
        return false;
    }

    function triggerHiddenEnding() {
        isRunning = false;
        enemies.forEach(e => createExplosion(e.x * tileSize + tileSize/2, e.y * tileSize + tileSize/2, '#e74c3c'));
        setTimeout(() => {
            document.getElementById('finalStatus').innerText = "TRUE ENDING 👑";
            document.getElementById('finalStatus').style.color = "#e74c3c";
            document.getElementById('finalMsg').innerHTML = `탈출 성공 및 랄파카 처단!<br>최종 기록: ${totalTime}초`;
            document.getElementById('finalScreen').style.display = 'flex';
        }, 1500);
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<50; i++) {
            particles.push({
                x: x, y: y, color: color,
                vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                life: 1.0, size: Math.random() * 8 + 2
            });
        }
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    function teleportPlayer() {
        let tx, ty; do { tx = Math.floor(Math.random()*cols); ty = Math.floor(Math.random()*rows); } 
        while(maze[ty][tx] === 1 || (Math.abs(tx-enemies[0]?.x||0) < 5));
        player.x = tx; player.y = ty;
    }

    function updateBoosters() {
        if(activeBoosters.speed > 0) activeBoosters.speed--;
        if(activeBoosters.stun > 0) activeBoosters.stun--;
        if(activeBoosters.ghost > 0) activeBoosters.ghost--;
    }

    function hit() {
        if (isFinalChase) { player.x = 0; player.y = 3; return; }
        if (isAlpacaRound) {
            alert("랄파카에게 잡혔습니다!"); player.x = 1; player.y = 1; player.keys = 0;
            activeBoosters = { speed: 0, stun: 0, ghost: 0 }; placeItems(); return;
        }
        player.lives--; player.keys = 0; activeBoosters = { speed: 0, stun: 0, ghost: 0 };
        if (player.lives <= 0) { alert("Game Over!"); location.reload(); }
        else { player.x = 1; player.y = 1; placeItems(); }
    }

    function winRound() {
        isRunning = false;
        if (isAlpacaRound) { startFinalChase(); }
        else if (round >= 3 || gameMode === 'pacman' || gameMode === 'dark') { 
            document.getElementById('finalTimeDisplay').innerText = totalTime;
            document.getElementById('finalScreen').style.display = 'flex';
        }
        else { 
            document.getElementById('msgScreen').style.display = 'flex';
            document.getElementById('roundAdvice').innerText = config[round-1].advice;
        }
    }

    function nextAction() { document.getElementById('msgScreen').style.display = 'none'; round++; initRound(); }

    function initRound() {
        const cfg = isAlpacaRound ? config[3] : (config[round-1] || config[0]);
        player.x = 1; player.y = 1; player.keys = 0; secretTimer = 0; secretNoteSpawned = false;
        
        if (gameMode === 'pacman' || gameMode === 'dark') player.lives = 1;
        else player.lives = (isAlpacaRound || isFinalChase) ? 1 : 3;

        document.body.style.backgroundColor = isAlpacaRound ? "#800000" : "#2c3e50";

        generateMaze(cfg.size);
        tileSize = Math.floor(window.innerHeight * 0.42 / cfg.size);
        canvas.width = tileSize * cfg.size; canvas.height = tileSize * cfg.size;
        isRunning = true;
    }

    function startFinalChase() {
        isAlpacaRound = false; isFinalChase = true;
        document.body.style.backgroundColor = "#2c3e50";
        generateMaze(33, 7); 
        for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) if(maze[r][c]!==1) maze[r][c]=0;
        maze[3][0] = 0; maze[3][32] = 99; 
        tileSize = Math.floor((window.innerWidth * 0.95) / 33);
        canvas.width = tileSize * 33; canvas.height = tileSize * 7;
        player.x = 0; player.y = 3; player.lives = 1; enemies = []; isRunning = true;
        setTimeout(() => { if (isFinalChase) enemies = [{ x: 0, y: 3, moveTick: 0, isWanderer: false }]; }, 4000);
    }

    function getNextStep(startX, startY, targetX, targetY) {
        const queue = [[startX, startY, []]]; const visited = new Set([`${startX},${startY}`]);
        while(queue.length > 0) {
            const [x, y, path] = queue.shift(); if(x === targetX && y === targetY) return path[0];
            for(const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                const nx = x+dx, ny = y+dy;
                if(nx>=0 && nx<cols && ny>=0 && ny<rows && maze[ny][nx]!==1 && !visited.has(`${nx},${ny}`)) {
                    visited.add(`${nx},${ny}`); queue.push([nx, ny, [...path, {x:nx, y:ny}]]);
                }
            }
        }
        return null;
    }

    function spawnSecretNote() { maze[rows-3][cols-3] = 8; }
    window.addEventListener('keydown', e => { if(isRunning && e.key.includes('Arrow')) move(e.key.replace('Arrow','').toLowerCase()); });
</script>
